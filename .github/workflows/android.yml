name: Android v0.1 checks and APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROBE_DEBUG_KEYSTORE: ${{ runner.temp }}/wechat-probe-debug.keystore
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reuse this probe's debug signing key for in-place test updates
        uses: actions/cache@v4
        with:
          path: ${{ env.PROBE_DEBUG_KEYSTORE }}
          key: probe-debug-keystore-v1
      - name: Create a debug-only key if the cache is empty
        run: |
          if [ ! -f "$PROBE_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$PROBE_DEBUG_KEYSTORE" -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Install exact SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Build, unit tests and strict lint
        run: bash ./gradlew build test lint --console=plain
      - name: Verify merged permissions and read-only APIs
        run: python3 scripts/verify_privacy.py
      - name: Verify the APK's debug signer
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk'
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WeChatUIProbe-v0.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*.html
            app/build/reports/lint-results*.xml
